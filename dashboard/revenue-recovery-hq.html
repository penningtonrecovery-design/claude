<title>Revenue Recovery HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky header with tab strip, one working view below; cards only for KPI tiles and panels. Weight-plate motif for the goal. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#EAEEE9; --ink:#14201A; --muted:#5B6A62; --line:#D9E0DA;
  --accent:#1D6B4E; --accent-ink:#FFFFFF; --accent-soft:#DCEDE4;
  --plate:#D2592A; --plate-soft:#F8E1D6;
  --good:#1F7A4D; --warn:#B7791F; --bad:#C0392B; --warn-soft:#FBF0DC; --bad-soft:#F9E0DD;
  --font-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E4ECE7; --muted:#97A69E; --line:#2A3730;
  --accent:#4DB487; --accent-ink:#06130D; --accent-soft:#1B3B2D;
  --plate:#EE8455; --plate-soft:#3D2418;
  --good:#5CC48F; --warn:#E3AA4F; --bad:#EE7468; --warn-soft:#3A2D14; --bad-soft:#3E1D1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E4ECE7; --muted:#97A69E; --line:#2A3730;
  --accent:#4DB487; --accent-ink:#06130D; --accent-soft:#1B3B2D;
  --plate:#EE8455; --plate-soft:#3D2418;
  --good:#5CC48F; --warn:#E3AA4F; --bad:#EE7468; --warn-soft:#3A2D14; --bad-soft:#3E1D1A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:50%;background:var(--plate);display:grid;place-items:center;flex:none}
.brand-mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface)}
.brand h1{font-size:18px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 13px var(--font-body);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-weight:500;color:var(--muted);margin-left:4px}
main{padding-block:20px 60px;display:grid;gap:20px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--font-body);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.panel > h2,.panel > .spread{margin-bottom:12px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpis.eight{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.kpis.eight{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi b{font:600 24px var(--font-display);letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--muted)}
/* Goal */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:14px}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.goal-head b{font:700 34px var(--font-display);letter-spacing:-.03em}
.goal-head b span{color:var(--muted);font-weight:500;font-size:22px}
.plates{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.plate{height:44px;border-radius:8px;background:var(--plate-soft);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 12px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
.plate.on{background:var(--plate);color:#fff}
.plate span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
td .name{font-weight:600}
td .sm{font-size:12px;color:var(--muted)}
.nowrap{white-space:nowrap}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-contacted{color:#3B6EA8;background:color-mix(in srgb,#3B6EA8 14%,transparent)}
.st-replied{color:#7B5BB5;background:color-mix(in srgb,#7B5BB5 14%,transparent)}
.st-call-booked{color:var(--warn);background:var(--warn-soft)}
.st-proposal-sent{color:var(--plate);background:var(--plate-soft)}
.st-won{color:var(--good);background:var(--accent-soft)}
.st-lost{color:var(--bad);background:var(--bad-soft)}
.due-over{color:var(--bad);font-weight:600}
.due-today{color:var(--warn);font-weight:600}
.flag{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--plate);background:var(--plate-soft);padding:2px 7px;border-radius:4px}
/* Bars */
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:var(--accent);border-radius:4px}
.bar-fill.plate{background:var(--plate)}
.bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bar-row .val{font-weight:600;min-width:56px;text-align:right}
.funnel{display:grid;gap:6px}
.f-step{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.f-bar{height:26px;background:var(--accent);border-radius:4px;justify-self:center;min-width:3px;color:var(--accent-ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.f-step .conv{font-size:12px;color:var(--muted);text-align:right}
@media (max-width:480px){.f-step{grid-template-columns:84px 1fr 64px}}
/* Actions list */
.actions{display:grid;gap:0}
.act{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .t{font-weight:600}
.act .d{font-size:12px;color:var(--muted)}
/* Filters & forms */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.filters input[type=search]{flex:1 1 200px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field > span{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%}
.field.wide{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
.section{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.section > h3{display:flex;gap:8px;align-items:center}
.calc{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:10px}
.calc .out{font:700 22px var(--font-display)}
.hl{animation:hl 1.6s ease-out}
@keyframes hl{from{background:var(--plate-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.hl{animation:none}}
/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(8,14,11,.45)}
.dlg{display:grid;max-height:calc(100dvh - 26px)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:16px 18px;overflow:auto;display:grid;gap:16px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mini{display:grid;gap:6px}
.mini-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);align-items:start}
.mini-item:last-child{border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--font-display);font-size:16px}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:600;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cols-hide-sm{}
@media (max-width:640px){.cols-hide-sm{display:none}}
.month-bars{display:flex;gap:4px;align-items:flex-end;height:70px}
.month-bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.month-bars div.cs{background:var(--plate)}
.client-card{display:grid;gap:12px}
</style>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><h1>Revenue Recovery HQ</h1><small>DFW gym pipeline · Fitness Revenue Recovery System</small></div></div>
      <button class="btn" data-act="newTouch">+ Log touch</button>
      <button class="btn primary" data-act="newGym">+ Add gym</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"><div class="dlg" id="dlg-inner"></div></dialog>
<input type="file" id="csv-file" accept=".csv,text/csv" hidden>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
// ---------- constants ----------
const STATUSES = ["not contacted","contacted","replied","call booked","proposal sent","won","lost"];
const RANK = {"not contacted":0,"contacted":1,"replied":2,"call booked":3,"proposal sent":4,"won":5};
const SOURCES = ["Phone audit","Cold email","Referral","Walk-in","Other"];
const TYPES = ["Big box","Boutique / studio","CrossFit / functional","Martial arts","Yoga / Pilates","24-hr access","Personal training","Other"];
const SIZES = ["Small (<300 members)","Medium (300–1,000)","Large (1,000+)"];
const TOUCH_TYPES = ["Phone audit call","Cold call","Follow-up call","Cold email","Follow-up email","Text / DM","Walk-in","Reply received","Other"];
const CALL_TYPES = new Set(["Phone audit call","Cold call","Follow-up call"]);
const MEETING_KINDS = ["Discovery call","Demo","Proposal review","Follow-up call"];
const MEETING_STATES = ["scheduled","held","no-show","cancelled"];
const OUTCOMES = ["pending","won","lost","stalled"];
const OBJECTIONS = ["Price","Timing","Already have a system","Not a priority","Need partner approval","Bad agency experience","Other"];
const DEFAULTS = {
  goalClients: 3,
  targets: {calls:25, contacts:15, booked:3, audits:2, proposals:1},
  audit: {inquiries:60, closeRate:25, avgDues:60, lifetimeMonths:12},
  caseStudyMultiple: 3
};
const METRICS = [
  ["calls","Calls (dials)"],["contacts","Contacts (reached DM)"],["booked","Calls booked"],["audits","Phone audits"],["proposals","Proposals sent"]
];
const VIEWS = [
  ["overview","Overview"],["prospects","Prospects"],["audits","Phone audits"],["outreach","Outreach"],
  ["calls","Calls & proposals"],["objections","Objections"],["clients","Clients"],["results","Client results"],["weekly","Weekly targets"]
];

// ---------- state ----------
const S = {
  gyms: [], touches: [], meetings: [], results: [], settings: structuredClone(DEFAULTS),
  loaded: new Set(), confirmed: false, slow: false, dbState: "connecting",
  view: "overview",
  f: {q:"", city:"", status:"", source:"", type:""}
};
try { Object.assign(S.f, JSON.parse(localStorage.getItem("rrhq-filters") || "{}")); } catch {}
let db = null, downloads = null;

// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(+n || 0).toLocaleString("en-US");
const pct = (a,b) => b ? Math.round(a/b*100) + "%" : "–";
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => iso(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const weekStart = s => { const d = parseD(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); };
const fmtD = s => s ? parseD(s).toLocaleDateString("en-US",{month:"short",day:"numeric"}) : "";
const fmtDY = s => s ? parseD(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "";
const fmtMonth = s => s ? new Date(+s.slice(0,4), +s.slice(5,7)-1, 1).toLocaleDateString("en-US",{month:"short",year:"numeric"}) : "";
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const slug = s => s.replace(/\s+/g,"-");
const clean = o => JSON.parse(JSON.stringify(o));
const gymById = id => S.gyms.find(g => g.id === id);
const gymName = id => gymById(id)?.name || "(deleted gym)";
const opts = (list, cur, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : "") +
  [...list, ...(cur && !list.includes(cur) ? [cur] : [])].map(v => `<option${v===cur?" selected":""}>${esc(v)}</option>`).join("");
const pill = st => `<span class="pill st-${slug(st||"not contacted")}">${esc(st||"not contacted")}</span>`;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2600); }
function fail(e){ console.error(e); toast(e?.code === "quota_exceeded" ? "Storage is full. Delete old records to add more." : "Couldn't save. Check your connection and try again."); }

// ---------- derived ----------
function lastTouchMap(){ const m = {}; for (const t of S.touches) if (!m[t.gymId] || t.date > m[t.gymId]) m[t.gymId] = t.date; return m; }
function evidenceRank(g){
  let r = 0;
  for (const t of S.touches) if (t.gymId === g.id) { r = Math.max(r, 1); if (t.type === "Reply received") r = Math.max(r, 2); }
  for (const m of S.meetings) if (m.gymId === g.id) { r = Math.max(r, 3); if (m.proposalSent || num(m.proposalAmount) > 0) r = Math.max(r, 4); if (m.outcome === "won") r = 5; }
  return r;
}
function reach(g){ return Math.max(g.reached || 0, RANK[g.status] ?? 0, evidenceRank(g)); }
function isClient(g){ return g.status === "won" && g.client && g.client.active !== false; }
function clients(){ return S.gyms.filter(g => g.status === "won" || g.client); }
function mrr(){ return S.gyms.filter(isClient).reduce((s,g) => s + num(g.client.fee), 0); }
function leakDefault(a){
  if (!a || !a.date) return 0;
  const missed = a.answered === "missed", fu = a.followUp === "yes";
  if (missed && !fu) return 50;
  let rt = parseFloat(a.responseMin); if (isNaN(rt)) rt = missed ? 60 : 0;
  let p = rt <= 5 ? 10 : rt <= 15 ? 20 : rt <= 60 ? 30 : 40;
  if (!fu) p += 10;
  return p;
}
function auditLoss(a){
  if (!a || !a.date) return 0;
  if (a.lostOverride !== undefined && a.lostOverride !== "" && a.lostOverride !== null) return num(a.lostOverride);
  const d = S.settings.audit;
  const inq = a.inquiries !== "" && a.inquiries != null ? num(a.inquiries) : d.inquiries;
  const leak = a.leakPct !== "" && a.leakPct != null ? num(a.leakPct) : leakDefault(a);
  const close = a.closeRate !== "" && a.closeRate != null ? num(a.closeRate) : d.closeRate;
  const dues = a.avgDues !== "" && a.avgDues != null ? num(a.avgDues) : d.avgDues;
  const life = a.lifetimeMonths !== "" && a.lifetimeMonths != null ? num(a.lifetimeMonths) : d.lifetimeMonths;
  return inq * leak/100 * close/100 * dues * life;
}
function weekActuals(ws){
  const we = addDays(ws, 6), inW = d => d && d >= ws && d <= we;
  const a = {calls:0, contacts:0, booked:0, audits:0, proposals:0};
  for (const t of S.touches) if (inW(t.date)) { if (CALL_TYPES.has(t.type)) a.calls++; if (t.reached) a.contacts++; }
  for (const m of S.meetings) { if (inW(m.bookedOn)) a.booked++; if (inW(m.proposalSent)) a.proposals++; }
  for (const g of S.gyms) if (inW(g.audit?.date)) a.audits++;
  return a;
}
function isCaseStudy(g){
  if (g.client?.caseStudy) return true;
  const fee = num(g.client?.fee); if (!fee) return false;
  return S.results.some(r => r.gymId === g.id && num(r.revenue) >= fee * S.settings.caseStudyMultiple);
}
function filtered(){
  const f = S.f, q = f.q.trim().toLowerCase();
  return S.gyms.filter(g =>
    (!f.city || (g.city||"") === f.city) && (!f.status || (g.status||"not contacted") === f.status) &&
    (!f.source || g.source === f.source) && (!f.type || g.type === f.type) &&
    (!q || [g.name,g.city,g.contact,g.email,g.phone,g.notes].join(" ").toLowerCase().includes(q))
  ).sort((a,b) => (a.name||"").localeCompare(b.name||""));
}
function dueClass(d){ if (!d) return ""; const t = today(); return d < t ? "due-over" : d === t ? "due-today" : ""; }

// ---------- auto-advance ----------
function advance(g, to){
  const cur = g.status || "not contacted";
  if (to === "won" || to === "lost") { g.status = to; }
  else if (cur === "won" || cur === "lost") { /* never move back automatically */ }
  else if ((RANK[to] ?? 0) > (RANK[cur] ?? 0)) g.status = to;
  g.reached = Math.max(g.reached || 0, RANK[g.status] ?? 0, to === "lost" ? 0 : (RANK[to] ?? 0));
  return g;
}

function todayList(){
  const t = today(), items = [];

  items.sort((a,b) => a.d.localeCompare(b.d));
  if (!items.length) return `<div class="empty"><b>Nothing overdue or due today</b><span>Set a next action and due date on a gym and it shows up here.</span></div>`;
  return `<div class="actions">${items.map(({g,d,kind,m}) => {
    const late = daysBetween(d, t);
    const when = late > 0 ? `<span class="due-over">${late} day${late>1?"s":""} overdue</span>` : `<span class="due-today">Due today</span>`;
    if (kind === "meeting") return `<div class="act"><div><div class="t">${esc(m.kind||"Meeting")} with ${esc(g?.name||"?")}</div><div class="d">${when} · ${fmtD(d)}${m.time?" "+esc(m.time):""} · mark held or no-show</div></div><button class="btn small" data-act="editMeeting" data-id="${m.id}">Update</button></div>`;
    return `<div class="act"><div><div class="t">${esc(g.nextAction || "Follow up")} · ${esc(g.name)}</div><div class="d">${when} · ${pill(g.status)} ${g.phone?" · "+esc(g.phone):""}</div></div><div class="row"><button class="btn small" data-act="newTouch" data-gym="${g.id}">Log touch</button><button class="btn small ghost" data-act="openGym" data-id="${g.id}">Open</button></div></div>`;

function funnel(){
  const G = S.gyms, n = G.length;
  const steps = [["Prospects",n],["Contacted",G.filter(g=>reach(g)>=1).length],["Replied",G.filter(g=>reach(g)>=2).length],["Call booked",G.filter(g=>reach(g)>=3).length],["Proposal sent",G.filter(g=>reach(g)>=4).length],["Won",G.filter(g=>reach(g)>=5).length]];
  const max = Math.max(1, n);
  return `<div class="funnel">${steps.map(([l,c],i) => `<div class="f-step"><span>${l}</span><div class="f-bar" style="width:${Math.max(c/max*100, c?6:0.5)}%">${c||""}</div><span class="conv">${i? pct(c, steps[i-1][1]) + " of prev" : ""}</span></div>`).join("")}</div>`;
}
function sourceTable(){

function auditFromForm(){
  return {date:val("a-date"), answered:val("a-answered"), responseMin:val("a-resp"), followUp:val("a-fu"), score:val("a-score"), notes:val("a-notes"),
    inquiries:val("a-inq"), leakPct:val("a-leak"), closeRate:val("a-close"), avgDues:val("a-dues"), lifetimeMonths:val("a-life"), lostOverride:val("a-over")};
}
function updateCalc(){
  const out = $("#a-out"); if (!out) return;
  const a = auditFromForm(), d = S.settings.audit;
  const probe = {...a, date: a.date || "x"};
  $("#a-leak").placeholder = leakDefault(probe) + " suggested";
  const v = auditLoss(probe);
  out.textContent = money(v) + " / mo";
  const inq = a.inquiries || d.inquiries, leak = a.leakPct || leakDefault(probe), close = a.closeRate || d.closeRate, dues = a.avgDues || d.avgDues, life = a.lifetimeMonths || d.lifetimeMonths;
  $("#a-explain").textContent = a.lostOverride ? "Using your override." : `${inq} inquiries × ${leak}% leaked × ${close}% close = ${(inq*leak/100*close/100).toFixed(1)} members lost each month × $${dues}/mo × ${life} months`;
}
function updateObjWarn(){
  const w = $("#o-warn"); if (!w) return;
  w.textContent = val("g-status") === "lost" && !val("o-cat") ? "This gym is marked lost. Pick the reason they gave so it shows up in your objections chart." : "";
  w.style.color = w.textContent ? "var(--bad)" : "";
}
dlg.addEventListener("input", e => { if (e.target.id?.startsWith("a-")) updateCalc(); if (e.target.id === "g-status" || e.target.id === "o-cat") updateObjWarn(); });
dlg.addEventListener("change", e => { if (e.target.id?.startsWith("a-")) updateCalc(); if (e.target.id === "g-status" || e.target.id === "o-cat") updateObjWarn(); });

async function saveGym(keepOpen){
  if (!needDb()) return;
  const name = val("g-name"); if (!name) { $("#g-name").focus(); toast("Give the gym a name."); return; }
  const prev = editing.id ? gymById(editing.id) : null;
  const g = editing.id ? clean(prev) : {created: new Date().toISOString(), reached: 0};
  g.id = editing.id || newId("gyms");
  Object.assign(g, {name, city:val("g-city"), website:val("g-website"), phone:val("g-phone"), contact:val("g-contact"), email:val("g-email"),
    type:val("g-type"), size:val("g-size"), source:val("g-source"), notes:val("g-notes"), status:val("g-status"), nextAction:val("g-next"), dueDate:val("g-due")});
  const a = auditFromForm();
  const hasAudit = Object.entries(a).some(([k,v]) => v);
  g.audit = hasAudit ? a : null;
  const oc = val("o-cat"), od = val("o-detail");
  g.objection = oc || od ? {category: oc || "Other", detail: od, date: g.objection?.date || today()} : null;
  const fee = val("c-fee"), start = val("c-start");
  if (g.status === "won" || fee || start || g.client) {
    g.client = {fee: num(fee) || num(latestProposal(g.id)), startDate: start || g.client?.startDate || today(), active: val("c-active"), caseStudy: val("c-cs")};
  }
  // reached: manual moves set the floor; lost keeps history
  g.reached = g.status === "lost" ? Math.max(prev?.reached || 0, evidenceRank(g)) : Math.max(RANK[g.status] ?? 0, evidenceRank(g));
  try {
    // a newly logged audit counts as a dial for the weekly target
    const auditTouch = a.date && !S.touches.some(t => t.gymId === g.id && t.type === "Phone audit call");
    await putGym(g);
    if (auditTouch) await putDoc("touches", {id:newId("touches"), gymId:g.id, date:a.date, type:"Phone audit call", reached:false, note:"Mystery-shop audit call", created:new Date().toISOString()});
    if (!keepOpen) { closeDlg(); toast(prev ? "Saved" : "Gym added"); }
    return true;
  } catch(e){ fail(e); return false; }
}
function latestProposal(gymId){
  const m = S.meetings.filter(x => x.gymId === gymId && num(x.proposalAmount)).sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
  return m ? m.proposalAmount : 0;
}

async function addTouchInline(){
  if (!needDb() || !editing?.id) return;
  const t = {id:newId("touches"), gymId:editing.id, date:val("t-date")||today(), type:val("t-type"), reached:val("t-reached"), note:val("t-note"), created:new Date().toISOString()};
  try {
    await putDoc("touches", t);
    const g = clean(gymById(editing.id)); advance(g, t.type === "Reply received" ? "replied" : "contacted");
    await putGym(g);
    toast("Touch logged");
    const sel = $("#g-status"); if (sel && (RANK[g.status] ?? -1) > (RANK[sel.value] ?? 99)) sel.value = g.status;
    const list = $("#sec-outreach .mini");
    if (list) { if (!list.querySelector(".mini-item")) list.innerHTML = "";
      list.insertAdjacentHTML("afterbegin", `<div class="mini-item"><span class="muted nowrap">${fmtD(t.date)}</span><span>${esc(t.type)}${t.reached?" · reached DM":""}${t.note?` · <span class="muted">${esc(t.note)}</span>`:""}</span><button type="button" class="btn small ghost danger" data-act="delTouch" data-id="${t.id}">Delete</button></div>`); }
    $("#t-note").value = ""; $("#t-reached").checked = false;
  } catch(e){ fail(e); }
}

async function saveTouch(){

async function saveMeeting(){
  if (!needDb()) return;
  const gymId = val("m-gym"); if (!gymId) { toast("Choose a gym."); return; }
  const prevOutcome = editingMeeting.id ? S.meetings.find(x => x.id === editingMeeting.id)?.outcome : null;
  const m = {id: editingMeeting.id || newId("meetings"), gymId, kind:val("m-kind"), date:val("m-date"), time:val("m-time"), bookedOn:val("m-booked") || today(), state:val("m-state"),
    proposalAmount:val("m-amt"), proposalSent:val("m-sent"), outcome:val("m-out"), notes:val("m-notes"), created: editingMeeting.created || new Date().toISOString()};
  if (num(m.proposalAmount) && !m.proposalSent) m.proposalSent = today();
  try {
    await putDoc("meetings", m);
    const g = clean(gymById(gymId));
    advance(g, "call booked");
    if (m.proposalSent) advance(g, "proposal sent");
    let then = null;

      g.client = {fee: num(g.client?.fee) || num(m.proposalAmount), startDate: g.client?.startDate || today(), active: true, caseStudy: !!g.client?.caseStudy};

    } else if (m.outcome === "lost") { advance(g, "lost"); if (!g.objection?.category) then = "objection"; }
    else if (m.outcome === "stalled" && !g.objection?.category) then = "objection";
    if (m.state === "held" && (m.kind === "Discovery call")) { /* no status change beyond call booked */ }
    await putGym(g);
    toast(m.outcome === "won" && prevOutcome !== "won" ? "Won! Client record created. Confirm the fee and start date." : "Saved");

// ---------- CSV ----------
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
const ALIASES = {
  name:["name","gym","gymname","business","businessname","company","companyname","prospect"],
  city:["city","town","location"], website:["website","url","site","web","websiteurl","domain"],
  phone:["phone","phonenumber","telephone","tel","mainphone","phone1"],
  contact:["owner","contact","ownercontact","contactname","ownername","manager","decisionmaker","ownerorcontact"],
  email:["email","emailaddress","mail","ownersemail","contactemail"], type:["type","gymtype","category"],
  size:["size","gymsize","members","membercount"], source:["source","leadsource"],
  status:["status","outreachstatus","stage"], notes:["notes","note","comments"], nextAction:["nextaction","nextstep"], dueDate:["duedate","due"]
};
const FIELD_LABEL = {name:"Name",city:"City",website:"Website",phone:"Phone",contact:"Owner/contact",email:"Email",type:"Gym type",size:"Size",source:"Lead source",status:"Status",notes:"Notes",nextAction:"Next action",dueDate:"Due date"};
function normSource(v, fallback){
  const s = (v||"").toLowerCase();
  if (!s) return fallback; if (s.includes("audit") || s.includes("phone")) return "Phone audit"; if (s.includes("email")) return "Cold email";
  if (s.includes("refer")) return "Referral"; if (s.includes("walk")) return "Walk-in"; return "Other";
}
let pendingImport = null;
function handleCsv(text){
  const rows = parseCSV(text);
  if (rows.length < 2) { toast("That file has no rows to import."); return; }
  const hdr = rows[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g,""));
  const map = {};
  for (const [field, al] of Object.entries(ALIASES)) { const i = hdr.findIndex(h => al.includes(h)); if (i >= 0) map[field] = i; }
  if (map.name === undefined) { toast("Couldn't find a gym name column. Name the column \"Name\" and try again."); return; }
  const existing = new Set(S.gyms.map(g => (g.name+"|"+(g.city||"")).toLowerCase()));
  const items = [], dups = [];
  for (const r of rows.slice(1)) {
    const get = k => map[k] !== undefined ? (r[map[k]] || "").trim() : "";
    const name = get("name"); if (!name) continue;
    const key = (name+"|"+get("city")).toLowerCase();
    const st = get("status").toLowerCase();
    const due = get("dueDate");
    const item = {name, city:get("city"), website:get("website"), phone:get("phone"), contact:get("contact"), email:get("email"), type:get("type"), size:get("size"),
      sourceRaw:get("source"), status: STATUSES.includes(st) ? st : "not contacted", notes:get("notes"), nextAction:get("nextAction"), dueDate: /^\d{4}-\d{2}-\d{2}$/.test(due) ? due : ""};
    if (existing.has(key)) dups.push(item); else { existing.add(key); items.push(item); }
  }
  pendingImport = items;
  const unmapped = rows[0].filter((h,i) => !Object.values(map).includes(i));
  openDlg(`${head("Import gyms from CSV")}
  <div class="dlg-body">
    <div class="kpis"><div class="kpi"><span class="eyebrow">New gyms</span><b>${items.length}</b></div><div class="kpi"><span class="eyebrow">Already in list</span><b>${dups.length}</b><span class="sub">same name + city, skipped</span></div></div>
    <div><div class="eyebrow">Columns matched</div><p style="margin:4px 0 0">${Object.keys(map).map(k => `<span class="pill st-won">${FIELD_LABEL[k]} ← ${esc(rows[0][map[k]])}</span>`).join(" ")}</p>
    ${unmapped.length ? `<p class="muted" style="font-size:12px">Ignored columns: ${unmapped.map(esc).join(", ")}</p>` : ""}</div>
    ${fld("Lead source for rows that don't have one", `<select id="imp-src">${opts(SOURCES, "Other")}</select>`)}
    ${items.length ? `<div class="tablewrap"><table><thead><tr><th>Name</th><th>City</th><th>Contact</th><th>Phone</th></tr></thead><tbody>${items.slice(0,5).map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.city)}</td><td>${esc(i.contact)}</td><td>${esc(i.phone)}</td></tr>`).join("")}</tbody></table></div>${items.length>5?`<span class="muted">…and ${items.length-5} more</span>`:""}` : ""}
    <div id="imp-progress" class="muted"></div>
  </div>
  <div class="dlg-foot"><button class="btn" data-act="close">Cancel</button>${items.length?`<button class="btn primary" data-act="runImport" id="imp-go">Import ${items.length} gyms</button>`:""}</div>`);
}
async function runImport(btn){
  if (!needDb() || !pendingImport) return;
  btn.disabled = true;
  const fb = val("imp-src"), prog = $("#imp-progress"), now = new Date().toISOString();
  let done = 0;
  try {
    for (const i of pendingImport) {
      const {sourceRaw, ...rest} = i;
      const g = {...rest, source: normSource(sourceRaw, fb), created: now, reached: RANK[rest.status] ?? 0};
      await db.collection("gyms").doc(newId("gyms")).set(clean(g));
      done++; if (done % 5 === 0 || done === pendingImport.length) prog.textContent = `Imported ${done} of ${pendingImport.length}…`;
    }
    pendingImport = null; closeDlg(); toast(`Imported ${done} gyms`); go("prospects");
  } catch(e){ fail(e); prog.textContent = `Stopped after ${done} gyms. Import the file again to add the rest; gyms already imported are skipped.`; btn.disabled = false; }
}
const csvCell = v => { v = String(v ?? ""); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
async function save(filename, data){
  if (!downloads) { toast("Downloads aren't available in this view."); return; }

function exportCsv(){
  const lt = lastTouchMap();
  const cols = ["Name","City","Website","Phone","Owner/contact","Email","Gym type","Size","Lead source","Status","Last touch","Next action","Due date","Audit date","Audit result","Response min","Follow-up","Audit score","Est lost per month","Objection","Objection detail","Monthly fee","Client start","Notes"];
  const rows = S.gyms.map(g => [g.name,g.city,g.website,g.phone,g.contact,g.email,g.type,g.size,g.source,g.status,lt[g.id]||"",g.nextAction,g.dueDate,g.audit?.date,g.audit?.answered,g.audit?.responseMin,g.audit?.followUp,g.audit?.score,g.audit?.date?Math.round(auditLoss(g.audit)):"",g.objection?.category,g.objection?.detail,g.client?.fee,g.client?.startDate,g.notes]);
  save(`dfw-gyms-${today()}.csv`, [cols, ...rows].map(r => r.map(csvCell).join(",")).join("\n"));
}

async function delGym(id){

    for (const t of S.touches.filter(x => x.gymId === id)) await db.collection("touches").doc(t.id).delete();

    await db.collection("gyms").doc(id).delete();
    closeDlg(); toast("Gym deleted");
  } catch(e){ fail(e); }
}

};

{ const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h)) S.view = h; }
render();
const slowTimer = setTimeout(() => { S.slow = true; schedule(); }, 10000);
function onErr(e){ if (e?.code === "revoked" || e?.code === "unavailable") { S.dbState = "revoked"; schedule(); } else console.error(e); }
function markLoaded(name, meta){
  S.loaded.add(name);
  if (S.loaded.size === 5 && !meta.fromCache && !S.confirmed) { S.confirmed = true; clearTimeout(slowTimer); }
  schedule();
}
(async () => {
  try { downloads = await window.claude?.use?.("downloads"); } catch { downloads = null; }
})();
(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db) { S.dbState = "none"; clearTimeout(slowTimer); schedule(); return; }
  S.dbState = "ok";
  for (const name of ["gyms","touches","meetings","results"]) {
    db.collection(name).onSnapshot(snap => { S[name] = snap.docs.map(d => ({id: d.id, ...d.data()})); markLoaded(name, snap.metadata); }, onErr);
  }
  db.doc("settings/main").onSnapshot(snap => {
    const d = snap.exists ? snap.data() : {};
    S.settings = {...structuredClone(DEFAULTS), ...d, targets:{...DEFAULTS.targets, ...(d.targets||{})}, audit:{...DEFAULTS.audit, ...(d.audit||{})}};
    markLoaded("settings", snap.metadata);
  }, onErr);
})();
})();
